[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wol-server"
version = "0.2.0"
description = "Secure remote Wake-on-LAN relay server for ESP32 devices"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=23.1",
  "asyncpg>=0.30",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "trustme>=1.1",
]

[project.scripts]
wol-server = "wol_server.__main__:main"

[tool.setuptools.packages.find]
include = ["wol_server*"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
