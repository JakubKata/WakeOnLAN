# docker compose up -d --build
# Needs .env (from .env.example, with POSTGRES_PASSWORD and TOKEN_PEPPER set)
# and the TLS certificate in certs/server.crt + certs/server.key.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wol
      POSTGRES_DB: wol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wol -d wol"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      SERVER_HOST: 0.0.0.0
      DATABASE_URL: postgresql://wol:${POSTGRES_PASSWORD}@db:5432/wol
      TLS_CERT_FILE: certs/server.crt
      TLS_KEY_FILE: certs/server.key
    ports:
      - "${CLIENT_PORT:-8443}:${CLIENT_PORT:-8443}"
      - "${DEVICE_PORT:-8444}:${DEVICE_PORT:-8444}"
    volumes:
      - ./certs:/app/certs:ro

volumes:
  db-data:
